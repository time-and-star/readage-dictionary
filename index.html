  if (!f) return;
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const backup = JSON.parse(String(reader.result));
      const preview = RA.storage.previewImport(backup);
      if (!preview.ok) { RA.notify(preview.errors.join('；')); return; }
      const labels = {saved:'收藏',notes:'笔记',senseState:'词条掌握状态',errors:'错题',history:'历史',quizStats:'统计字段'};
      const summary = Object.entries(preview.summary).map(([key,n]) => labels[key] + '：现有 ' + n.current + '，备份 ' + n.incoming).join('\n');
      if (!window.confirm('将替换以下类别，未包含类别保持原值：\n' + summary + '\n确认恢复？')) return;
      const ok = RA.learn.importData(backup);
      RA.notify(ok ? '已导入备份数据' : '文件格式不正确，导入失败');
      if (ok) RA.render();
    } catch (err) {
      RA.notify('文件解析失败：' + err.message);
    }
  };
  reader.readAsText(f);
  e.target.value = '';
});
</script>
</body>
</html>
